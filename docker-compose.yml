services:
  qb-slow-queue:
    # 镜像 tag 由 qbslowqueue/__init__.py 的 __docker_tag__ 派生，构建前通过环境变量注入。
    # 兜底默认值与 __init__.py 的 __docker_tag__ 保持一致，未注入 QB_IMAGE_TAG 时仍指向同一镜像。
    image: ${QB_IMAGE_TAG:-docker.cnb.cool/1983shake/qb-slow-queue:latest}
    build:
      context: .
    container_name: qb-slow-queue
    restart: unless-stopped
    environment:
      # ----- 时区配置（解决日志时间差 8 小时）-----
      # 镜像已内置 Asia/Shanghai，此处可覆盖为其它时区（如 Asia/Tokyo）。
      # 注意：修改后必须 docker compose up -d --force-recreate 才会生效。
      - TZ=${TZ:-Asia/Shanghai}
      # ----- qBittorrent 连接配置（按实际情况修改）-----
      - QB_HOST=${QB_HOST}          # qBittorrent 的 IP 地址
      - QB_PORT=${QB_PORT}          # WebUI 端口
      - QB_API_KEY=${QB_API_KEY}    # WebUI API Key（WebUI → 选项 → WebUI → 认证 → API Key）
      # ----- 运行参数 -----
      - SPEED_THRESHOLD=${SPEED_THRESHOLD}   # 速度阈值（字节/秒），51200 = 50KB/s
      - CHECK_INTERVAL=${CHECK_INTERVAL}    # 检查间隔（秒），300 = 5分钟；每次扫描即时移动低于阈值的任务
      - LOG_LEVEL=${LOG_LEVEL}              # 日志级别: DEBUG/INFO/WARNING/ERROR
    volumes:
      # 可选：挂载日志目录（便于持久化查看日志）
      - ./logs:/app/logs
    # 如果 qBittorrent 和本容器不在同一网络，需要确保网络互通
    # 如果都在飞牛 Docker 的同一 bridge 网络，可直接用 IP 访问
    # 建议创建外部网络或使用 host 模式（见下方注释）
    # network_mode: host  # 取消注释可使用 host 网络模式
